  <!-- groupify panel -->
  <g transform="translate(820 190)">
    <rect x="0" y="0" width="300" height="220" rx="18" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.25)"/>
    <text x="20" y="42" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#7ce3b1">Groupify</text>
    <rect x="20" y="62" width="150" height="11" rx="5" fill="rgba(255,255,255,.30)"/>
