    <g transform="translate(120 0)">
      <circle cx="30" cy="30" r="28" fill="rgba(255,255,255,.18)"/>
      <circle cx="30" cy="22" r="10" fill="rgba(255,255,255,.32)"/>
      <path d="M12 52 a18 18 0 0 1 36 0" fill="rgba(255,255,255,.32)"/>
      <text x="30" y="80" font-family="Arial, sans-serif" font-size="14" fill="#eafff3" text-anchor="middle">Bruno</text>
